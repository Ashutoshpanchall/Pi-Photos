services:
  piphotos-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: piphotos-server:latest
    container_name: piphotos-server
    restart: unless-stopped
    # network_mode: host allows direct LAN TLS connection and mDNS (UDP 5353) without avahi reflector
    network_mode: host
    environment:
      - PIPHOTOS_DATA_DIR=/data
      - PIPHOTOS_STORAGE=/storage
      - PIPHOTOS_PORT=8443
      - PIPHOTOS_NAME=Home Vault
    volumes:
      - ./data:/data
      - ./storage:/storage
