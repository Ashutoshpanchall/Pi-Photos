[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "piphotos-server"
version = "1.0.0"
description = "PiPhotos self-hosted photo backup server"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [{ name = "PiPhotos Team" }]
keywords = ["photos", "backup", "gallery", "self-hosted", "privacy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "zeroconf>=0.136.0",
    "cryptography>=43.0.0",
    "qrcode[pil]>=8.0",
    "python-multipart>=0.0.18",
    "httpx>=0.27.0",
]

[project.scripts]
piphotos-server = "piphotos_server.cli:main"

[tool.setuptools]
packages = ["piphotos_server"]
py-modules = ["main", "auth", "database", "storage", "tls_cert", "discovery", "models"]
